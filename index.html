
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Gold Tunisia</title>
<style>
body{margin:0;background:#111;color:#f5d477;font-family:Arial;text-align:center;padding:20px}
main{max-width:500px;margin:auto;background:#222;padding:22px;border:2px solid #b58b35;border-radius:16px}
h1{color:#f5d477}
input,select,button{padding:13px;margin:8px;border-radius:8px;border:0;font-size:17px}
button{background:#c69b38;color:#111;font-weight:bold;cursor:pointer}
#reels{font-size:48px;background:#111;padding:20px;border-radius:12px;margin:20px 0}
#message{min-height:30px;color:white}
.small{color:#bbb;font-size:13px}
</style>
</head>
<body>
<main>
<h1>BLACK GOLD TUNISIA</h1>
<p>🎰 كازينو ترفيهي تجريبي</p>

<div id="login">
<p>اكتب اسمك للدخول</p>
<input id="username" placeholder="اسم اللاعب">
<button onclick="login()">دخول</button>
</div>

<div id="game" style="display:none">
<h3>مرحبا <span id="player"></span></h3>
<h2>رصيدك: <span id="balance">1000</span> د.ت افتراضية</h2>

<p>اختار لعبة السلوت</p>
<select id="gameType">
<option value="classic">سلوت كلاسيك 🎰</option>
<option value="fruit">سلوت الفواكه 🍒</option>
<option value="gold">سلوت الذهب 💰</option>
</select>

<p>قيمة اللعب</p>
<select id="bet">
<option value="1">1 د.ت افتراضية</option>
<option value="5">5 د.ت افتراضية</option>
<option value="10">10 د.ت افتراضية</option>
</select>

<div id="reels">🍒 | ⭐ | 🍋</div>
<button onclick="spin()">العب الآن</button>
<p id="message"></p>
<button onclick="logout()">خروج</button>
</div>

<p class="small">الرصيد افتراضي للترفيه فقط، لا إيداع ولا سحب ولا قيمة نقدية.</p>
</main>

<script>
let user="";
let balance=1000;
const symbols={
classic:["🍒","⭐","💎","7️⃣","🔔"],
fruit:["🍒","🍋","🍉","🍇","🍊"],
gold:["💰","👑","🪙","💎","⭐"]
};

function login(){
let name=document.getElementById("username").value.trim();
if(!name){alert("اكتب اسمك أولا");return;}
user=name;
let saved=localStorage.getItem("bg_"+user);
balance=saved===null?1000:Number(saved);
document.getElementById("player").textContent=user;
document.getElementById("login").style.display="none";
document.getElementById("game").style.display="block";
update();
}

function update(){
document.getElementById("balance").textContent=balance;
localStorage.setItem("bg_"+user,balance);
}

function spin(){
let bet=Number(document.getElementById("bet").value);
if(balance<bet){
document.getElementById("message").textContent="رصيدك غير كافٍ!";
return;
}
balance-=bet;
let type=document.getElementById("gameType").value;
let s=symbols[type];
let a=s[Math.floor(Math.random()*s.length)];
let b=s[Math.floor(Math.random()*s.length)];
let c=s[Math.floor(Math.random()*s.length)];
document.getElementById("reels").textContent=a+" | "+b+" | "+c;

let msg="حظ أوفر في المرة القادمة!";
if(a===b && b===c){
balance+=bet*10;
msg="🎉 مبروك! ربحت "+(bet*10)+" د.ت افتراضية!";
}else if(a===b || b===c || a===c){
balance+=bet*2;
msg="👏 ربحت "+(bet*2)+" د.ت افتراضية!";
}
document.getElementById("message").textContent=msg;
update();
}

function logout(){
user="";
document.getElementById("game").style.display="none";
document.getElementById("login").style.display="block";
}
</script>
</body>
</html>

}
</script>
</body>
</html>
