<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Gold Tunisia</title>
<style>
body{background:#111;color:#f5d477;font-family:Arial;text-align:center;padding:20px}
main{max-width:500px;margin:auto;background:#222;padding:20px;border:1px solid #c9a23c;border-radius:15px}
input,button{padding:12px;margin:7px;border-radius:7px}
input{width:85%}button{background:#c9a23c;border:0;font-weight:bold;cursor:pointer}
h1{color:#e9bd4d}.hidden{display:none}
</style>
</head>
<body>
<h1>BLACK GOLD TUNISIA</h1>
<p>منصة ترفيه عائلية بنقاط افتراضية</p>
<main>
<div id="login">
<h2>الدخول أو التسجيل</h2>
<input id="name" placeholder="اسم المستخدم">
<input id="pass" type="password" placeholder="كلمة المرور">
<br><button onclick="enter(true)">حساب جديد</button>
<button onclick="enter(false)">دخول</button>
<p id="msg"></p>
</div>
<div id="game" class="hidden">
<h2>مرحبا <span id="who"></span></h2>
<h3>رصيدك: <span id="points">100</span> نقطة</h3>
<button onclick="play()">🎡 جرّب حظك</button>
<p id="result"></p>
<button onclick="logout()">خروج</button>
</div>
</main>
<p>النقاط افتراضية فقط ولا توجد أموال حقيقية أو مدفوعات.</p>
<script>
let users=JSON.parse(localStorage.users||"{}"),current="";
function enter(create){
let n=document.getElementById("name").value.trim();
let p=document.getElementById("pass").value;
if(!n||!p){msg.textContent="اكتب اسم المستخدم وكلمة المرور";return}
if(create){
if(users[n]){msg.textContent="الاسم موجود";return}
users[n]={password:p,points:100};
}else if(!users[n]||users[n].password!==p){
msg.textContent="معلومات الدخول غير صحيحة";return
}
localStorage.users=JSON.stringify(users);
current=n;login.classList.add("hidden");game.classList.remove("hidden");
who.textContent=n;points.textContent=users[n].points;
}
function play(){
let v=Math.floor(Math.random()*31);
users[current].points+=v;
localStorage.users=JSON.stringify(users);
points.textContent=users[current].points;
result.textContent="ربحت "+v+" نقطة افتراضية!";
}
function logout(){
current="";game.classList.add("hidden");login.classList.remove("hidden");
}
</script>
</body>
</html>
